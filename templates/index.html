<!DOCTYPE html>
<html>
<head>
    <title>Fanqie Novel Downloader</title>
</head>
<body>
    <h1>Fanqie Novel Downloader</h1>
    <form action="/download" method="post">
        <label for="url">Enter Novel Page URL:</label><br>
        <input type="text" id="url" name="url" size="100" value="https://fanqienovel.com/page/7276384138653862966"><br><br>

        <label for="start_chapter">Start Chapter:</label>
        <input type="number" id="start_chapter" name="start_chapter" min="1" value="1">

        <label for="end_chapter">End Chapter:</label>
        <input type="number" id="end_chapter" name="end_chapter" min="1" value="10">
        <br><br>

        <input type="submit" name="download_type" value="Download Range">
        <input type="submit" name="download_type" value="Download All">
    </form>

    <p><b>Note:</b> Downloading all chapters may require an SVIP token. This feature is not fully implemented and might not work for all chapters.</p>
</body>
</html>
