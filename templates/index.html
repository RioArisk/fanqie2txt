<!DOCTYPE html>
<html>
<head>
    <title>番茄小说下载器</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            background-color: #06c;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        #download-message {
            display: none;
            margin-top: 20px;
            font-size: 1.2em;
            color: #06c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>番茄小说下载器</h1>
        <form action="/download" method="post" onsubmit="showDownloadMessage()">
            <label for="url">输入小说页面URL:</label>
            <input type="text" id="url" name="url" size="100" value="https://fanqienovel.com/page/7207072067127086118"><br>

            <label for="start_chapter">开始章节:</label>
            <input type="number" id="start_chapter" name="start_chapter" min="1" value="1">

            <label for="end_chapter">结束章节:</label>
            <input type="number" id="end_chapter" name="end_chapter" min="1" value="10">
            <br>

            <input type="submit" name="download_type" value="下载范围" id="download-range-btn">
            <input type="submit" name="download_type" value="下载全部" id="download-all-btn">
        </form>
        <p id="download-message" style="display: none;">下载中，请稍候...</p>
        <p><b>注意:</b> 下载全本小说可能需要SVIP Token，此功能尚未完全实现，可能无法下载所有章节。</p>
    </div>

    <script>
        function showDownloadMessage() {
            document.getElementById('download-message').style.display = 'block';
            document.getElementById('download-range-btn').disabled = true;
            document.getElementById('download-all-btn').disabled = true;
        }
    </script>
</body>
</html>
